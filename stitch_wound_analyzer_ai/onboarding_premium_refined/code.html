<script>
    document.addEventListener('DOMContentLoaded', () => {
        const btnNext = document.getElementById('btn-next');
        const btnSkip = document.getElementById('skip-btn');
        
        const finishOnboarding = () => {
            btnNext.innerHTML = '<span class="material-symbols-outlined animate-spin text-2xl">progress_activity</span>';
            setTimeout(() => {
                alert('Onboarding Complete! Transitioning to Home Screen.');
                btnNext.innerHTML = '<span class="material-symbols-outlined text-2xl">arrow_forward</span>';
            }, 800);
        };

        btnNext.addEventListener('click', finishOnboarding);
        btnSkip.addEventListener('click', finishOnboarding);
    });
</script>
